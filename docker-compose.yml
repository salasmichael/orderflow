services:
  postgres:
    image: postgres:16
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: orderflow-api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://orderflow:orderflow@postgres:5432/orderflow
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: